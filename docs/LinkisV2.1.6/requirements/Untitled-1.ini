2.【低风险】【运维优化】【Linkis】【公共服务-结果集查询】【后端需求】linkis publicservice openfile增加拦截，禁止打开超过10w行结果集，防止服务OOM




修复Hive引擎24小时后，kerberos刷新成功，但认证失败问题
背景：
在开启kerberos认证集群环境中，该环境每小时刷新一次kerberos，Hive引擎在执行24H后，出现kerberos认证异常TGT

改造点：
1.改造成全局ugi
2.保证Hive引擎在执行24H后，不能出现kerberos认证异常TGT






linkis publicservice openfile增加拦截，禁止打开超过10w行结果集，防止服务OOM
背景：
当结果集超过10w行，用户使用openfile 接口，不断翻页时，每次读取只获取5000行，在翻页到10w行之后很容易影响服务稳定性，可能会导致服务oom，因此需要进行限制

改造点：
1.功能增加开关，默认关闭，测试环境打开（bdap-dev，bdap-uat环境打开）
2.结果集超过10w行，翻页翻到10w之后时，功能关闭情况下，打印一行warn日志，记录在服务日志里面，方便追溯
3.结果集超过10w行，翻页翻到10w之后时，功能打开情况下，直接返回错误信息，提示用户读取超出10w行的规则




1.确认 Hive 引擎实际使用的认证凭证位置  hadoop用的是3.3.5，
2.你排查下
3.看日志确认刷新路径，TGT expired, refreshing UGI  出现过
