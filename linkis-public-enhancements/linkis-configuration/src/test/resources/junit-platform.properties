# Cucumber JUnit Platform Engine Configuration
# See: https://github.com/cucumber/cucumber-jvm/tree/main/cucumber-junit-platform-engine

# Enable Cucumber TestEngine
cucumber.engine.enabled=true

# Feature files location
cucumber.features=classpath:features/user-config-delete.feature

# Glue path (where step definitions are)
cucumber.glue=org.apache.linkis.configuration.cucumber.steps

# Plugin configuration
cucumber.plugin=pretty,html:target/cucumber-reports/user-config-delete.html,json:target/cucumber-reports/user-config-delete.json

# Default tag filter (exclude @Ignore tagged scenarios)
cucumber.filter.tags=not @Ignore

# Object Factory - use Spring for dependency injection in step definitions
cucumber.object-factory=io.cucumber.spring.SpringFactory