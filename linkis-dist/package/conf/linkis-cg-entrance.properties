##restful
wds.linkis.server.restful.scan.packages=org.apache.linkis.entrance.restful
wds.linkis.server.socket.mode=false
#wds.linkis.entrance.config.log.path=hdfs:///tmp/linkis/
wds.linkis.resultSet.store.path=hdfs:///tmp/linkis

wds.linkis.server.user.restful.uri.pass.auth=/actuator/prometheus,/api/rest_j/v1/offline,/api/rest_j/v1/entrance/operation

## enable entrance label registration
#spring.eureka.instance.metadata-map.route=et1

## enable variable operation default vaule false
# wds.linkis.variable.operation=true

##Spring
spring.server.port=9104
wds.linkis.entrance.user.creator.ip.interceptor.switch=false

## you may set service version if you want to distinguish different configuration version
spring.eureka.instance.metadata-map.linkis.conf.version=v1

## spark3 强制切换开关（默认关闭，开启后按 用户>部门>应用(creator) 优先级强制将 Spark2 任务切换到 Spark3）
#spark.version.coercion.switch=false
## 强制切换的用户名单（逗号分隔，热加载，getHotValue）
#spark.version.coercion.users=
## 强制切换的部门ID名单（逗号分隔，热加载，getHotValue）
#spark.version.coercion.department.id=
## 强制切换的应用(creator)名单（逗号分隔，热加载，getHotValue）【新增】
#spark.version.coercion.creators=